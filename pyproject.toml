[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholargraph"
version = "0.1.0"
description = "A scholarly knowledge-graph platform: Spark lakehouse, knowledge graph, graph neural network, fine-tuned embeddings and a GraphRAG agent over OpenAlex"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evangelos Tempelopoulos" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1", "delta-spark>=4.0,<4.1"]   # Phase 1 at scale (needs Java 17 or 21)
graph = ["neo4j>=5.20"]                                    # Phase 2 with a real Neo4j server
dl = ["torch>=2.3", "transformers>=4.44", "peft>=0.12"]    # Phases 3-5
baseline = ["lightgbm>=4.3"]                               # Phase 3 baseline
serve = ["fastapi>=0.110", "uvicorn>=0.29"]                # Phase 5 API
track = ["mlflow>=2.14"]                                   # experiment tracking (optional)
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
scholargraph = "scholargraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scholargraph = ["resources/*.json"]
